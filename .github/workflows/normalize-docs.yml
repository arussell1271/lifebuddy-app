name: Normalize Documentation Links

on:
    pull_request:
    push:
        branches: [main]

jobs:
    normalize-docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Set up Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.11"
            - name: Run normalize-doc-links (check mode)
              run: |
                  python scripts/normalize_doc_links.py --repo-root . --check .github documentation summaries README_DOCUMENTATION.md .github/copilot-instructions.md || exit 1
              shell: bash
